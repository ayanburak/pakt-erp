# Alembic ayarları. Veritabanı adresi burada değil .env dosyasında durur,
# migrations/env.py onu erp.config.Settings üzerinden okur.

[alembic]
script_location = %(here)s/migrations
path_separator = os

# Dosyalar oluşturulma tarihiyle başlar, böylece klasörde sırayla dizilir.
# Örnek: 2026_10_22_3f9a1c2b7d4e_set_updated_at.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
